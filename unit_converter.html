<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ühikute konverter</title>
  <style>
    :root { --ink:#172b3a; --muted:#617485; --line:#d9e2e8; --blue:#145b83; --bg:#f2f6f8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
      font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
      display:grid; place-items:center; padding:20px; }
    .card { width:min(100%,660px); background:#fff; border:1px solid var(--line);
      border-radius:16px; padding:28px; box-shadow:0 8px 28px #17324610; }
    h1 { margin:0; font-size:28px; }
    .intro { margin:6px 0 22px; color:var(--muted); }
    label { font-size:13px; font-weight:700; display:block; margin:0 0 6px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .wide { grid-column:1/-1; }
    select,input { width:100%; font:inherit; color:var(--ink); border:1px solid #bdcbd4;
      border-radius:8px; padding:11px; background:#fff; }
    input { font-size:21px; }
    .swap { display:flex; justify-content:center; margin:-1px 0; }
    .swap button { border:1px solid var(--line); background:#edf4f7; color:var(--blue);
      border-radius:8px; padding:7px 14px; font-size:18px; cursor:pointer; }
    .swap button:hover { background:#dceef5; }
    .result { margin-top:18px; padding:16px; background:#eaf4f8; border-radius:10px; }
    .result small { color:var(--muted); display:block; }
    .result strong { font-size:28px; overflow-wrap:anywhere; }
    .note,.disclaimer { font-size:12px; color:var(--muted); margin:14px 0 0; }
    .disclaimer { border-top:1px solid var(--line); padding-top:12px; }
    .error { color:#a4262c; font-size:13px; min-height:18px; }
    @media(max-width:520px) { .card { padding:20px; } .grid { grid-template-columns:1fr; }
      .wide { grid-column:auto; } .swap { margin:0; } }
  </style>
</head>
<body>
  <main class="card">
    <h1>Ühikute konverter</h1>
    <p class="intro">Sisesta väärtus, vali ühikud ja tulemus arvutatakse kohe.</p>
    <div class="grid">
      <div class="wide"><label for="category">Mõõtesuurus</label><select id="category"></select></div>
      <div><label for="value">Sisendväärtus</label>
        <input id="value" type="number" inputmode="decimal" step="any" value="1"></div>
      <div><label for="from">Lähteühik</label><select id="from"></select></div>
      <div class="wide swap"><button id="swap" type="button" aria-label="Vaheta ühikud">⇅ Vaheta ühikud</button></div>
      <div class="wide"><label for="to">Sihtühik</label><select id="to"></select></div>
    </div>
    <div id="error" class="error" role="alert" aria-live="polite"></div>
    <div class="result" aria-live="polite"><small>Tulemus</small><strong id="result">—</strong></div>
    <p id="note" class="note"></p>
    <p class="disclaimer">See on käsitsi kasutatav üldine ühikukonverter. See ei asenda AMOS-i
      partno-põhiseid UOM-reegleid ega mõjuta automaatselt hinnakalkulatsiooni.</p>
  </main>
  <script src="unit_converter.js"></script>
</body>
</html>

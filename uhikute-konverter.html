<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ühikute konverter</title>
<style>
:root{--ink:#172b3a;--muted:#617485;--line:#d9e2e8;--blue:#145b83;--bg:#f2f6f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(100%,660px);background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 8px 28px #17324610}h1{margin:0;font-size:28px}.intro{margin:6px 0 22px;color:var(--muted)}label{font-size:13px;font-weight:700;display:block;margin:0 0 6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.wide{grid-column:1/-1}select,input{width:100%;font:inherit;color:var(--ink);border:1px solid #bdcbd4;border-radius:8px;padding:11px;background:#fff}input{font-size:21px}.swap{display:flex;justify-content:center;margin:-1px 0}.swap button{border:1px solid var(--line);background:#edf4f7;color:var(--blue);border-radius:8px;padding:7px 14px;font-size:18px;cursor:pointer}.result{margin-top:18px;padding:16px;background:#eaf4f8;border-radius:10px}.result small{color:var(--muted);display:block}.result strong{font-size:28px;overflow-wrap:anywhere}.note{font-size:12px;color:var(--muted);margin:14px 0 0}.error{color:#a4262c;font-size:13px;min-height:18px}@media(max-width:520px){.card{padding:20px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.swap{margin:0}}
</style></head>
<body><main class="card"><h1>Ühikute konverter</h1><p class="intro">Sisesta väärtus, vali ühikud ja tulemus arvutatakse kohe.</p>
<div class="grid"><div class="wide"><label for="category">Mõõtesuurus</label><select id="category"></select></div><div><label for="value">Sisendväärtus</label><input id="value" type="number" inputmode="decimal" step="any" value="1"></div><div><label for="from">Lähteühik</label><select id="from"></select></div><div class="wide swap"><button id="swap" type="button" aria-label="Vaheta ühikud">⇅ Vaheta ühikud</button></div><div class="wide"><label for="to">Sihtühik</label><select id="to"></select></div></div>
<div id="error" class="error" aria-live="polite"></div><div class="result" aria-live="polite"><small>Tulemus</small><strong id="result">—</strong></div><p id="note" class="note"></p>
</main><script>
const groups={
 'Pikkus':{units:[['mm','millimeeter',0.001],['cm','sentimeeter',0.01],['m','meeter',1],['km','kilomeeter',1000],['in','toll',0.0254],['ft','jalg',0.3048],['yd','jard',0.9144],['mi','miil',1609.344]]},
 'Mass':{units:[['mg','milligramm',0.000001],['g','gramm',0.001],['kg','kilogramm',1],['t','tonn',1000],['oz','unts',0.028349523125],['lb','nael',0.45359237]]},
 'Maht':{units:[['mL','milliliiter',0.001],['L','liiter',1],['m³','kuupmeeter',1000],['US fl oz','USA vedelunts',0.0295735295625],['US pt','USA pint',0.473176473],['US qt','USA quart',0.946352946],['US gal','USA gallon',3.785411784],['Imp gal','Briti gallon',4.54609]]},
 'Rõhk':{units:[['Pa','paskal',1],['kPa','kilopaskal',1000],['bar','baar',100000],['psi','nael ruuttolli kohta',6894.757293168],['atm','standardatmosfäär',101325]]},
 'Pöördemoment':{units:[['N·m','njuutonmeeter',1],['N·cm','njuutonsentimeeter',0.01],['lbf·ft','naeljalg',1.3558179483314],['lbf·in','naeltoll',0.1129848290276]]},
 'Temperatuur':{units:[['°C','Celsiuse kraad',null],['°F','Fahrenheiti kraad',null],['K','kelvin',null]]}
};
const category=document.querySelector('#category'),from=document.querySelector('#from'),to=document.querySelector('#to'),value=document.querySelector('#value');
function fill(select,units,selected){select.innerHTML=units.map(([id,name])=>`<option value="${id}">${name} (${id})</option>`).join('');if(selected&&units.some(u=>u[0]===selected))select.value=selected}
function setupCategory(keep=true){const prevFrom=from.value,prevTo=to.value;const units=groups[category.value].units;fill(from,units,keep?prevFrom:null);fill(to,units,keep?prevTo:null);if(from.value===to.value&&units.length>1)to.selectedIndex=1;convert()}
function tempConvert(x,a,b){let c;if(a==='°C')c=x;else if(a==='°F')c=(x-32)*5/9;else c=x-273.15;if(b==='°C')return c;if(b==='°F')return c*9/5+32;return c+273.15}
function convert(){const x=Number(value.value),a=from.value,b=to.value;const err=document.querySelector('#error'),out=document.querySelector('#result');if(value.value.trim()===''||!Number.isFinite(x)){out.textContent='—';err.textContent='Sisesta kehtiv arv.';return}if(category.value==='Temperatuur'){const y=tempConvert(x,a,b);if(y< -273.15-1e-10){out.textContent='—';err.textContent='Tulemus jääks alla absoluutse nulli.';return}out.textContent=`${new Intl.NumberFormat('et-EE',{maximumSignificantDigits:10}).format(y)} ${b}`}else{const units=groups[category.value].units;const fa=units.find(u=>u[0]===a)[2],fb=units.find(u=>u[0]===b)[2];const y=x*fa/fb;out.textContent=`${new Intl.NumberFormat('et-EE',{maximumSignificantDigits:10}).format(y)} ${b}`}err.textContent='';document.querySelector('#note').textContent=category.value==='Maht'?'USA gallon (US gal) ja Briti gallon (Imp gal) on erineva suurusega.':category.value==='Temperatuur'?'Temperatuuride teisendus kasutab Celsiuse, Fahrenheiti ja kelvini valemeid.':'Tulemus on ühikute matemaatiline teisendus. Lennukihoolduses kontrolli alati tööjuhendi nõutud ühikut ja ümardamist.'}
Object.keys(groups).forEach((name,i)=>{const o=document.createElement('option');o.value=name;o.textContent=name;category.append(o)});category.value='Pikkus';setupCategory(false);category.addEventListener('change',()=>setupCategory(false));[from,to,value].forEach(el=>el.addEventListener('input',convert));document.querySelector('#swap').addEventListener('click',()=>{const a=from.value;from.value=to.value;to.value=a;convert()});
</script></body></html>
